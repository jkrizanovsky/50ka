<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Vítejte na oslavě</title>
  <link rel="icon" type="image/png" href="images/50.png"/>

  <!-- Y2K / 2K style fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link
    href="https://fonts.googleapis.com/css2?family=Anton&family=Montserrat:wght@400;500;600&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="css/style.css"/>
</head>
<body>

  <!-- ======================================================
       SECTION 1 — Welcome
       ====================================================== -->
  <section id="welcome">
    <div class="welcome-content">

      <!-- Title row: text + cycling number image -->
      <div class="title-row">
        <div class="title-text-container">
          <h1 class="main-title chrome-text">Vítejte&nbsp;na&nbsp;oslavě*</h1>
        </div>
        <div class="title-number-container">
          <div class="cycling-number" aria-label="Počet let">
            <img
              id="cycling-img"
              src="images/25.png"
              alt="25"
              width="320"
              height="200"
              decoding="async"
              fetchpriority="high"
            />
          </div>
        </div>
      </div>

      <!-- Subtext -->
      <p class="subtitle">*zatím ještě ne doslova</p>

    </div>

    <div id="scroll-cue" aria-hidden="true">
      <span class="scroll-cue-arrow">↓</span>
    </div>
  </section>

  <!-- ======================================================
       SECTION 2 — Scroll-zoom face zone
       The tall #zoom-zone provides scroll distance.
       #face-sticky stays pinned while the face scales up.
       ====================================================== -->
  <div id="zoom-zone">
    <div id="face-sticky">

      <!-- The face image (scales via JS scroll handler) -->
      <div id="face-img-wrapper">
        <div id="face-img">
          <img
            class="face-half"
            src="images/Lenka_main_left.png"
            alt="Levá polovina obličeje Lenky"
            width="960"
            height="1080"
            loading="eager"
            decoding="async"
            fetchpriority="high"
          />
          <img
            class="face-half"
            src="images/Petr_main_right.png"
            alt="Pravá polovina obličeje Petra"
            width="960"
            height="1080"
            loading="eager"
            decoding="async"
            fetchpriority="high"
          />
        </div>
      </div>

      <!-- Overlay: question text + invisible split buttons
           The question text has pointer-events: none so clicks
           pass through to the buttons beneath it. -->
      <div id="face-overlay" role="region" aria-label="Výběr strany">
        <div id="face-bottom-group">
          <p
            id="face-helper-hint"
            class="face-helper-hint"
            aria-live="polite"
            aria-label="klikněte na polovinu obličeje"
          >klikni na polovinu obličeje</p>

          <h2 class="face-question">Koho&nbsp;máš&nbsp;raději?</h2>
        </div><!-- /#face-bottom-group -->

        <!-- Left half — GIRLIE PARTYYY -->
        <button
          id="btn-left"
          class="half-btn"
          aria-label="Levá polovina"
          onclick="chooseLeft()"
        ></button>

        <!-- Right half — Ožerem seee! -->
        <button
          id="btn-right"
          class="half-btn"
          aria-label="Pravá polovina"
          onclick="chooseRight()"
        ></button>

      </div><!-- /#face-overlay -->

    </div><!-- /#face-sticky -->
  </div><!-- /#zoom-zone -->

  <!-- ======================================================
       TRANSITION OVERLAY
       Fullscreen flash shown briefly after clicking a side.
       ====================================================== -->
  <div id="transition-overlay" aria-live="polite">
    <span id="transition-main" class="transition-main chrome-text"></span>
    <span id="transition-sub"  class="transition-sub"></span>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
