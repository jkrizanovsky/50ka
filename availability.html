<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dotazník</title>

  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link
    href="https://fonts.googleapis.com/css2?family=Anton&family=Montserrat:wght@400;500;600&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="css/style.css"/>
</head>
<body class="questionnaire-locked">
  <div id="questionnaire-number-bouncer" class="questionnaire-number-bouncer" aria-hidden="true">
    <img
      id="questionnaire-number-bouncer-img"
      src="images/25.png"
      alt=""
      width="320"
      height="200"
      loading="eager"
      decoding="async"
    />
  </div>

  <main class="availability-page questionnaire-page">
    <section class="questionnaire-shell" aria-live="polite">
      <header class="questionnaire-header">
        <h1 class="availability-question chrome-text">Dotazník</h1>
        <p class="questionnaire-subtitle">Vyplň prosím pár otázek a na konci se podepiš.</p>
      </header>
      <div id="questionnaire-flow" class="questionnaire-flow"></div>
    </section>
  </main>

  <div id="transition-overlay" aria-live="polite">
    <span id="transition-main" class="transition-main chrome-text"></span>
    <span id="transition-sub" class="transition-sub"></span>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
