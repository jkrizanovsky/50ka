<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Máš čas?</title>

  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link
    href="https://fonts.googleapis.com/css2?family=Anton&family=Montserrat:wght@400;500;600&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="css/style.css"/>
</head>
<body>

  <main class="availability-page">

    <h1 class="availability-question chrome-text">
      Máš&nbsp;čas&nbsp;12.&nbsp;9.&nbsp;2026?
    </h1>

    <div class="availability-buttons" role="group" aria-label="Odpovědi">
      <button class="avail-btn btn-yes"   data-answer="ano">Ano</button>
      <button class="avail-btn btn-no"    data-answer="ne">Ne</button>
      <button class="avail-btn btn-maybe" data-answer="uvidime">Uvidíme</button>
    </div>

    <p id="confirm-message"></p>

  </main>

  <script src="js/app.js"></script>
</body>
</html>
